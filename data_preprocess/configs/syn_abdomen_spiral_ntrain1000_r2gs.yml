dataset_type: syn
organ: abdomen
model: r2gs
raw_gt: spiral_tools/data_generator_usr/volume_gt/abdomen.npy
gt_xy_invert: false
output_root: data
n_train: 1000
n_test: 1000
seed: 0

stitch:
  enabled: false

object_scale: 50
proj_rescale: 400

scanner:
  mode: cone
  DSD: 47.2
  DSO: 26.9260009765625
  nDetector: [64, 888]
  sDetector: [3.2764801, 45.4611614]
  nVoxel: [256, 256, 256]
  sVoxel: [16.0, 16.0, 24.0]
  offOrigin: [0, 0, 0]
  offDetector: [0, 0]
  accuracy: 0.5
  coord_left: false
  filter: null
  noise: false
  possion_noise: 100000
  gaussian_noise: [0, 10]

spiral:
  z_start: -12
  z_end: 12
  pitch: 0.9844
  sample_per_rotation: 984
  angle_start: 0

init:
  n_points: 50000
  density_threshold: auto
  density_rescale: 0.15
